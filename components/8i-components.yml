    description: >-
      Main scene object. Parameter groups: Audio (attenuation), Eighti (PAT Data
      Asset, Playing Status, Open Status), Init Controls (Enable Logging, Use
      Verbosity, Loop Playback, Playback Speed, Enable Hardware Decode If Available,
      Enable Hardware Texture Output, Enable Audio), Playback Info (Asset Frame Rate,
      Asset Duration, Current Frame timestamp), Playback Controls (Start Time, ...),
      Material.
  - name: PATAsset
    description: Data asset that a PATActor loads during play.
