apis:
- aid: 8i:webplayer
  name: 8i WebPlayer
  description: 'The 8i WebPlayer (volcap-player.js) is an embeddable browser player
    for 8i PAT volumetric content, served from the 8i CDN and documented publicly.
    It ships an A-Frame hologram component and a THREE.js EightiHologram class with
    documented attributes, properties, methods and playback events, adaptive-bitrate
    MPEG-DASH streaming (HLS on Safari), clearkey DRM, and WebXR / 8th Wall AR support.
    It is a client-side library rather than an HTTP API: 8i publishes no OpenAPI, GraphQL
    SDL, or other machine-readable contract for it.'
