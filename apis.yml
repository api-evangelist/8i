aid: 8i
name: 8i
description: '8i is a volumetric video company that captures, transforms, and streams
  photorealistic holograms of real people for AR, VR, WebXR, and mobile experiences.
  It sells the ASPX hologram capture stages (cameras, lights, sync boxes, calibration
  and recording software), a transformation pipeline that encodes captures into its
  PAT mesh-based codec with MPD/MPEG-DASH, glTF and FBX outputs, and a streaming layer
  that distributes holograms over CDN with shareable links, DRM and viewer analytics.
  Developers integrate 8i holograms through the 8i Unity Plugin, the 8i Unreal Plugin,
  and the embeddable 8i WebPlayer (volcap-player.js), which exposes an A-Frame hologram
  component and a THREE.js EightiHologram class with adaptive-bitrate DASH/HLS playback,
  clearkey DRM, and WebXR / 8th Wall augmented reality.'
